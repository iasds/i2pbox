name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libboost-program-options-dev libssl-dev zlib1g-dev xz-utils
      - name: Build and test
        run: make -j"$(nproc)" VERSION="${GITHUB_REF_NAME:-dev}" && make test
      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-dev}"
          directory="i2pbox-${version}-linux-x86_64"
          mkdir -p "dist/$directory"
          strip i2pbox
          install -m 755 i2pbox "dist/$directory/i2pbox"
          install -m 644 LICENSE "dist/$directory/LICENSE"
          tar -C dist -czf "dist/i2pbox-linux-x86_64.tar.gz" "$directory"
          tar -C dist -cJf "dist/i2pbox-linux-x86_64.tar.xz" "$directory"
          (cd dist && sha256sum i2pbox-linux-x86_64.tar.gz i2pbox-linux-x86_64.tar.xz > SHA256SUMS)
      - uses: anchore/sbom-action@v0
        with:
          artifact-name: i2pbox
          file: i2pbox
          format: spdx-json
          output-file: dist/i2pbox-linux-x86_64.spdx.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/i2pbox-linux-x86_64.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/i2pbox-linux-x86_64.tar.gz
            dist/i2pbox-linux-x86_64.tar.xz
            dist/SHA256SUMS
            dist/i2pbox-linux-x86_64.spdx.json
