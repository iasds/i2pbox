name: Monitor i2pd releases

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fetch submodule tags
        run: git -C i2pd fetch --tags --force
      - uses: actions/github-script@v7
        with:
          script: |
            const latest = await github.rest.repos.getLatestRelease({ owner: 'PurpleI2P', repo: 'i2pd' });
            const { execFileSync } = require('child_process');
            let pinned;
            try {
              pinned = execFileSync('git', ['-C', 'i2pd', 'describe', '--tags', '--exact-match']).toString().trim();
            } catch (err) {
              pinned = execFileSync('git', ['-C', 'i2pd', 'rev-parse', '--short', 'HEAD']).toString().trim();
            }
            const title = `Track i2pd ${latest.data.tag_name}`;
            // per_page 100: far more than the open-issue count this repo
            // accumulates between weekly runs
            const issues = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.data.filter(issue => issue.title === title);
            if (pinned === latest.data.tag_name) {
              // pinned is already at the latest upstream release: close any
              // lingering tracking issue instead of leaving it open forever
              for (const issue of existing) {
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed' });
              }
              return;
            }
            if (existing.length) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Pinned i2pd version: \`${pinned}\`\n\nUpstream release: ${latest.data.html_url}\n\nCreate an upgrade branch, build, run \`make test\`, and review the upstream changelog before publishing.`
            });
