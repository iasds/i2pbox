name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: normal
            build: make -j"$(nproc)"
            test: make test
          - name: sanitizers
            build: >-
              make CXXFLAGS='-Wall -Wextra -std=c++17 -O1 -g
              -fno-omit-frame-pointer -fsanitize=address,undefined
              -D_FORTIFY_SOURCE=2 -fPIE -Wformat -Wformat-security
              -Wno-unused-parameter' LDFLAGS='-fsanitize=address,undefined
              -Wl,-z,relro,-z,now -Wl,-z,noexecstack -pie' -j"$(nproc)"
            test: >-
              make CXXFLAGS='-Wall -Wextra -std=c++17 -O1 -g
              -fno-omit-frame-pointer -fsanitize=address,undefined
              -D_FORTIFY_SOURCE=2 -fPIE -Wformat -Wformat-security
              -Wno-unused-parameter' LDFLAGS='-fsanitize=address,undefined
              -Wl,-z,relro,-z,now -Wl,-z,noexecstack -pie' test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libboost-program-options-dev libssl-dev zlib1g-dev
      - name: Build
        run: ${{ matrix.build }}
      - name: Run regression tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ${{ matrix.test }}

  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang libboost-program-options-dev libssl-dev zlib1g-dev
      - name: Build fuzz targets
        run: make fuzz-build
      - name: Smoke fuzz each parser
        run: ./tests/fuzz/run_fuzz_smoke.sh 15

  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential golang-go openjdk-21-jdk-headless libboost-program-options-dev libssl-dev zlib1g-dev
      - name: Build
        run: make -j"$(nproc)"
      - name: Cross-validate against go-i2p and emissary
        run: ./tests/interop/run_interop.sh ./i2pbox "go rust"
      - name: Cross-validate against i2p-java (heavy build)
        continue-on-error: true
        run: ./tests/interop/run_interop.sh ./i2pbox "java"
