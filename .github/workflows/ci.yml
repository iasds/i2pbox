name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"  # weekly deep fuzz (Monday 03:00 UTC)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: normal
            build: make -j"$(nproc)"
            test: make test
          - name: sanitizers
            build: >-
              make CXXFLAGS='-Wall -Wextra -std=c++17 -O1 -g
              -fno-omit-frame-pointer -fsanitize=address,undefined
              -D_FORTIFY_SOURCE=2 -fPIE -Wformat -Wformat-security
              -Wno-unused-parameter' LDFLAGS='-fsanitize=address,undefined
              -Wl,-z,relro,-z,now -Wl,-z,noexecstack -pie' -j"$(nproc)"
            test: >-
              make CXXFLAGS='-Wall -Wextra -std=c++17 -O1 -g
              -fno-omit-frame-pointer -fsanitize=address,undefined
              -D_FORTIFY_SOURCE=2 -fPIE -Wformat -Wformat-security
              -Wno-unused-parameter' LDFLAGS='-fsanitize=address,undefined
              -Wl,-z,relro,-z,now -Wl,-z,noexecstack -pie' test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libboost-program-options-dev libssl-dev zlib1g-dev
      - name: Build
        run: ${{ matrix.build }}
      - name: Run regression tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ${{ matrix.test }}

  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang libboost-program-options-dev libssl-dev zlib1g-dev
      - name: Build fuzz targets
        run: make fuzz-build
      - name: Smoke fuzz each parser
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ./tests/fuzz/run_fuzz_smoke.sh 60
          else
            ./tests/fuzz/run_fuzz_smoke.sh 15
          fi
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ github.run_id }}
          path: |
            oom-*
            crash-*
            timeout-*
            leak-*
            /tmp/fuzz-*.log
          if-no-files-found: ignore

  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential golang-go openjdk-21-jdk-headless libboost-program-options-dev libssl-dev zlib1g-dev
      - name: Build
        run: make -j"$(nproc)"
      - name: Cross-validate against go-i2p and emissary
        run: ./tests/interop/run_interop.sh ./i2pbox "go rust"
      - name: Cross-validate against i2p-java (heavy build)
        continue-on-error: true
        run: ./tests/interop/run_interop.sh ./i2pbox "java"

  cppcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      # Repo sources only (i2pd submodule is upstream code). Scope is
      # warning-level findings for repo files: uninitMemberVar fires only in
      # upstream i2pd headers, syntaxError is a cppcheck parser false positive
      # on vain.cpp's `for (int j = 8; j--;)` idiom (gcc/clang accept it).
      # inlineSuppr lets deliberate spots be marked // cppcheck-suppress <id>.
      - name: Run cppcheck on repo sources
        run: |
          cppcheck --std=c++17 --enable=warning --inline-suppr \
            --error-exitcode=2 \
            --suppress=missingIncludeSystem \
            --suppress=syntaxError \
            --suppress=uninitMemberVar \
            -I i2pd/libi2pd -I i2pd/libi2pd_client \
            --check-level=exhaustive \
            *.cpp *.h *.hpp common/*.hpp common/*.h 2>&1 | tee /tmp/cppcheck.log
      - name: Upload analysis log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-log-${{ github.run_id }}
          path: /tmp/cppcheck.log
          if-no-files-found: ignore
